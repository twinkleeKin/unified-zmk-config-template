# 本文件生成 GitHub Actions 的构建矩阵（每项产出一个 uf2）。
#
# 现有的 ESB 拓扑（dongle 作 central，左右手作 peripheral）：
#   corne_esb_dongle : 无按键的 USB 接收器（central），插到主机 USB 口
#   corne_left       : 左手，ESB peripheral id = 1
#   corne_right      : 右手，ESB peripheral id = 2
#
# 注意：nice_nano_v2 在 ZMK main（Zephyr 4.1 / HWMv2）里叫 nice_nano@2.0.0，
#       //zmk 是 ZMK 的 board variant 限定符，缺少它构建会直接报错。
---
include:
  - board: nice_nano@2.0.0//zmk
    shield: corne_esb_dongle

  - board: nice_nano@2.0.0//zmk
    shield: corne_left

  - board: nice_nano@2.0.0//zmk
    shield: corne_right
