# Corne ESB Dongle（无按键 USB 接收器）—— ESB central
#
# 该文件只作用于 corne_esb_dongle 构建。dongle 插在主机 USB 口上，
# 通过 USB HID 连主机，通过 ESB 接收左右手（以及鼠标/轨迹球）的事件。
# BLE 已关闭，所以不要再往 keymap 里放 &bt 之类的 BLE 行为。

# --- 关闭 BLE / 老式 split transport，改用 ESB ---
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

# central 角色（shield 的 Kconfig.defconfig 已经默认打开，这里显式写一遍更直观）
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# --- peripheral 数量 ---
# ZMK_SPLIT_ESB_PERIPHERAL_COUNT 会覆盖 ZMK_SPLIT_CENTRAL_PERIPHERAL_COUNT，
# 这个值会被 central 直接当作数组下标（各 peripheral 的状态/电池槽位），
# 所以必须 **大于** 网络里最大的 PERIPHERAL_ID，否则会越界写内存。
#   左手 = 1、右手 = 2、鼠标建议 = 3  =>  这里取 4
# 以后再加设备就把它调大（并同步 CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS / CONFIG_BT_MAX_PAIRED）。
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=4
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=4
CONFIG_BT_MAX_PAIRED=4

# 需要追踪的最大键位号（丢包后补发/自愈用）。
# 现在键位编号是：0~4 = 鼠标的 5 个按键，5~46 = Corne 的 42 键（见 config/corne.overlay）
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=47

# --- 鼠标（pointing + 滚轮）---
# 鼠标在 ESB 网络里也是一个 peripheral，两条通道各自独立：
#   * 指针移动 / 滚轮 → input 事件，靠 corne_esb_dongle.overlay 里的
#     zmk,input-split(reg=4) + zmk,input-listener 接收；
#   * 5 个鼠标按键 → key position 0~4，含义完全由 config/corne.keymap 定义。
# ZMK_POINTING 默认是 n，必须显式打开（它会 select INPUT）
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
CONFIG_ZMK_INPUT_SPLIT=y
CONFIG_ZMK_INPUT_SPLIT_MAX_TRACKED_KEYS=5
# 鼠标上报频率高得多，队列给大一些
CONFIG_INPUT_QUEUE_MAX_MSGS=512
# 占位编码器：接收鼠标上报的滚轮（sensor）事件，节点见 corne_esb_dongle.overlay
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- 电池电量上报：dongle 读取各 peripheral 的电量 ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# --- ESB 参数：必须与所有 peripheral（左右手、鼠标）完全一致 ---
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=250
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=2
CONFIG_ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP=y
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_MIN=5
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_STEP=18
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_CH_COUNT=4
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP_EVT_RETRY=6
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=16
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# --- 缓冲与栈：dongle 要同时处理多路事件，给得比 peripheral 宽一些 ---
CONFIG_ZMK_SPLIT_ESB_PROTO_MSGQ_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=16
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512
CONFIG_USB_WORKQUEUE_STACK_SIZE=4096
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024

# --- 日志 ---
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_PRIORITY=10

# --- 稳定性辅助 ---
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y

# --- 调试 ---
# CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_DBG=y

# USB HID 轮询率显式提高
# CONFIG_USB_HID_POLL_INTERVAL_MS=1
